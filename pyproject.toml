[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"

fastapi = "0.115.5"
sqlalchemy = "2.0.35"
uvicorn = "0.32.1"
alembic = "1.14.0"
python-dotenv = "1.0.1"
passlib = "1.7.4"
pydantic = {extras = ["email"], version = "2.10.1"}
fastapi-mail = "1.4.2"
asyncpg = "0.30.0"
motor = "^3.7.0"
aiofiles = "^24.1.0"
python-multipart = "^0.0.20"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
