services:

  trip-nest-armenia-backend:
    build:
      dockerfile: Dockerfile
    command: python run_.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/TripNestArmenia-backend
    depends_on:
      - trip-nest-armenia-postgres
      - trip-nest-armenia-mongo

  trip-nest-armenia-postgres:
    image: postgres:17.2-alpine3.20
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    env_file:
      - .env

  trip-nest-armenia-mongo:
    image: mongo:7.0.5
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    env_file:
      - .env

volumes:
  postgres_data:
  mongo_data:
